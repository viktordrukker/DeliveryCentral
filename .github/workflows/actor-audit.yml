name: actor-audit

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  actor-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: D-103 actor-audit coverage (>= 98%)
        run: npm run actor-audit:check
